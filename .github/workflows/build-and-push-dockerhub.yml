name: Build and Push Data Plane Images (DockerHub)

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOCKERHUB_LAUNCHER_IMAGE: bigdog/ai-training-job-launcher
  DOCKERHUB_TRAINING_IMAGE: bigdog/ai-training-job

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push job-launcher
        uses: docker/build-push-action@v5
        with:
          context: .
          file: data-plane/launcher/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKERHUB_LAUNCHER_IMAGE }}:latest

      - name: Build and push training-job (example)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: data-plane/training-job/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKERHUB_TRAINING_IMAGE }}:latest
