name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and push control-plane
      uses: docker/build-push-action@v5
      with:
        context: .
        file: control-plane/api/Dockerfile.prod
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-platform-control-plane:latest
    - name: Build and push job-launcher
      uses: docker/build-push-action@v5
      with:
        context: .
        file: data-plane/launcher/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-platform-job-launcher:latest
    - name: Build and push event-processor
      uses: docker/build-push-action@v5
      with:
        context: .
        file: control-plane/event-processor/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-platform-event-processor:latest
    - name: Build and push training-job
      uses: docker/build-push-action@v5
      with:
        context: .
        file: data-plane/training-job/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-platform-training-job:latest
