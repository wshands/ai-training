apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-launcher
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: job-launcher-role
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: job-launcher-rb
subjects:
  - kind: ServiceAccount
    name: job-launcher
roleRef:
  kind: Role
  name: job-launcher-role
  apiGroup: rbac.authorization.k8s.io
