#apiVersion: v1
#kind: Namespace
#metadata:
#  name: {{ .Values.namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-launcher
  #namespace: {{ .Values.namespace }}
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: job-launcher-role
  #namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "update", "patch"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: job-launcher-rb
  #namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: job-launcher
    #namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: job-launcher-role
  apiGroup: rbac.authorization.k8s.io