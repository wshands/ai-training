apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-launcher
  #namespace: training-jobs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-launcher
  template:
    metadata:
      labels:
        app: job-launcher
    spec:
      serviceAccountName: job-launcher
      containers:
        - name: job-launcher
          image: ai-platform-job-launcher:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP
              value: "host.docker.internal:9092"
            - name: JOB_EVENTS_TOPIC
              value: "job-events"
            - name: TRAINING_NAMESPACE
              value: "training-jobs"
          # Optional: simple readiness check that the process is running
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          # If you don't expose HTTP, you can remove this probe.