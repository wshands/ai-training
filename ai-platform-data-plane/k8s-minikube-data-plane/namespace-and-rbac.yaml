#apiVersion: v1
#kind: Namespace
#metadata:
#  name: training-jobs
#---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-launcher
  #namespace: training-jobs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-launcher
  namespace: training-jobs
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get","list","watch","create","delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get","list","watch","create","delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-launcher
  namespace: training-jobs
subjects:
  - kind: ServiceAccount
    name: job-launcher
    namespace: training-jobs
roleRef:
  kind: Role
  name: job-launcher
  apiGroup: rbac.authorization.k8s.io
