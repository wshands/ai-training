replicaCount: 1

image:
  repository: ai-platform-d-control-plane
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: control-plane.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

env:
  KAFKA_BOOTSTRAP: "kafka:9092"
  POSTGRES_DSN: "postgresql://postgres:postgres@postgres:5432/controlplane"
  REDIS_URL: "redis://redis:6379/0"
  CLERK_JWKS_URL: ""
  CLERK_ISSUER: ""
  CLERK_AUDIENCE: ""
  CLERK_JWT_ALGORITHM: "RS256"
  CONTROL_PLANE_ADMIN_TOKEN: ""
  KAFKA_SECURITY_PROTOCOL: ""
  KAFKA_SASL_MECHANISM: ""
  KAFKA_SASL_USERNAME: ""
  KAFKA_SASL_PASSWORD: ""
  KAFKA_SSL_CA_FILE: ""
  KAFKA_SSL_CERT_FILE: ""
  KAFKA_SSL_KEY_FILE: ""
  DATA_PLANE_API_TOKEN: ""
  DATA_PLANE_TENANT_ID: ""
  DATA_PLANE_API_TOKENS: ""
  DATA_PLANE_LOG_POLLS: "true"

extraEnv: []
extraEnvFrom: []

secretMounts: []
# Example:
# secretMounts:
#   - name: kafka-ca
#     secretName: kafka-ca
#     mountPath: /etc/ssl/kafka

livenessProbe:
  enabled: true
  path: /docs
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  enabled: true
  path: /docs
  initialDelaySeconds: 5
  periodSeconds: 10
