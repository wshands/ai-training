apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-processor
spec:
  replicas: {{ .Values.eventProcessor.replicas }}
  selector:
    matchLabels:
      app: event-processor
  template:
    metadata:
      labels:
        app: event-processor
    spec:
      containers:
      - name: event-processor
        image: {{ .Values.eventProcessor.image }}
        env:
        - name: KAFKA_BOOTSTRAP
          value: {{ .Values.kafka.bootstrap | quote }}
        - name: POSTGRES_DSN
          value: {{ .Values.postgres.dsn | quote }}
