apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      containers:
      - name: control-plane
        image: {{ .Values.controlPlane.image }}
        env:
        - name: KAFKA_BOOTSTRAP
          value: {{ .Values.kafka.bootstrap | quote }}
        - name: POSTGRES_DSN
          value: {{ .Values.postgres.dsn | quote }}
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
spec:
  selector:
    app: control-plane
  ports:
  - port: 8000
    targetPort: 8000
