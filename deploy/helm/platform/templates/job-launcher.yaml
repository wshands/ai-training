apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-launcher
spec:
  replicas: {{ .Values.jobLauncher.replicas }}
  selector:
    matchLabels:
      app: job-launcher
  template:
    metadata:
      labels:
        app: job-launcher
    spec:
      serviceAccountName: job-launcher-sa
      containers:
      - name: job-launcher
        image: {{ .Values.jobLauncher.image }}
        env:
        - name: KAFKA_BOOTSTRAP
          value: {{ .Values.kafka.bootstrap | quote }}
        - name: KAFKA_TOPIC
          value: "job-events"
        - name: TRAINING_NAMESPACE
          value: "training-jobs"
