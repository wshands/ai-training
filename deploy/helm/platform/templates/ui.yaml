apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-dashboard
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      app: ui-dashboard
  template:
    metadata:
      labels:
        app: ui-dashboard
    spec:
      containers:
      - name: ui-dashboard
        image: {{ .Values.ui.image }}
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: ui-dashboard
spec:
  selector:
    app: ui-dashboard
  ports:
  - port: 80
    targetPort: 3000
