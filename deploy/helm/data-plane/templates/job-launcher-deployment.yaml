apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-launcher
spec:
  replicas: {{ .Values.jobLauncher.replicas }}
  selector:
    matchLabels:
      app: job-launcher
  template:
    metadata:
      labels:
        app: job-launcher
    spec:
      serviceAccountName: job-launcher
      containers:
        - name: job-launcher
          image: "{{ .Values.jobLauncher.image.repository }}:{{ .Values.jobLauncher.image.tag }}"
          imagePullPolicy: {{ .Values.jobLauncher.image.pullPolicy }}
          env:
            - name: TRAINING_NAMESPACE
              value: "{{ .Values.jobLauncher.trainingNamespace }}"
            {{- if .Values.jobLauncher.trainingImage }}
            - name: TRAINING_IMAGE
              value: "{{ .Values.jobLauncher.trainingImage }}"
            {{- end }}
            {{- if .Values.jobLauncher.controlPlaneUrl }}
            - name: CONTROL_PLANE_URL
              value: "{{ .Values.jobLauncher.controlPlaneUrl }}"
            {{- end }}
            {{- if .Values.jobLauncher.dataPlaneApiToken }}
            - name: DATA_PLANE_API_TOKEN
              value: "{{ .Values.jobLauncher.dataPlaneApiToken }}"
            {{- end }}
            {{- if .Values.jobLauncher.dataPlaneTenantId }}
            - name: DATA_PLANE_TENANT_ID
              value: "{{ .Values.jobLauncher.dataPlaneTenantId }}"
            {{- end }}
            {{- if .Values.jobLauncher.httpxLogLevel }}
            - name: HTTPX_LOG_LEVEL
              value: "{{ .Values.jobLauncher.httpxLogLevel }}"
            {{- end }}
            {{- if .Values.jobLauncher.logLevel }}
            - name: LOG_LEVEL
              value: "{{ .Values.jobLauncher.logLevel }}"
            {{- end }}
