jobLauncher:
  image:
    repository: <REGISTRY>/job-launcher
    tag: <IMAGE_TAG>
    pullPolicy: IfNotPresent
  replicas: 1
  trainingImage: <REGISTRY>/training-job:<IMAGE_TAG>
  trainingNamespace: "training-jobs"
  controlPlaneUrl: "https://control-plane.example.com"
  dataPlaneApiToken: "<data-plane-token>"
  dataPlaneTenantId: "<tenant-id>"
  httpxLogLevel: "WARNING"
