services:
  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    ports:
      - "9092:9092"
      - "19092:19092"

    # Make Kafka reachable from Minikube pods
    extra_hosts:
      - "host.minikube.internal:host-gateway"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      # Kafka binds (listens) on port 9092 + controller port
      KAFKA_LISTENERS: >
        PLAINTEXT_HOST://0.0.0.0:9092,
        PLAINTEXT_K8S://0.0.0.0:19092,
        CONTROLLER://127.0.0.1:9093

      # These are the ADDRESSES clients see
      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT_HOST://kafka:9092,
        PLAINTEXT_K8S://host.minikube.internal:19092

      # Map listener names to protocols
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        PLAINTEXT_HOST:PLAINTEXT,
        PLAINTEXT_K8S:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      # KRaft controller listener name
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # Also update the controller’s quorum voters to use 0.0.0.0
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@127.0.0.1:9093"

      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT_HOST"

      # MUST be a UUID
      CLUSTER_ID: "23b7ef2d-85f1-47d8-89b1-51e37732f4e0"

      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

      # Single-node required settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD", "/bin/bash", "-lc", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      start_period: 25s
      retries: 20

  db-init:
    build:
      context: .
      dockerfile: control-plane/Dockerfile.dev
    environment:
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/controlplane
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-c", "import asyncio; from common.ai_training_common.db import init_db; asyncio.run(init_db())"]
    restart: "no"

  postgres:
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: controlplane
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ✅ NEW: Redis for pub/sub + websocket fanout
  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  control-plane:
    build:
      context: .
      dockerfile: control-plane/Dockerfile.dev   # 👈 only in dev compose
    environment:
      KAFKA_BOOTSTRAP: kafka:9092   # FIXED
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/controlplane
      REDIS_URL: redis://redis:6379/0

      # The debugger will wait for a debugger to attach at port 5679
      # but this doesn't work with Clerk auth flows, so disabled for now.
      # Don't try to connect to the debugger through VSCode,
      # just run the UI with npm start     
      WAIT_FOR_DEBUGGER: "0"

      CLERK_JWKS_URL: https://bursting-asp-1.clerk.accounts.dev/.well-known/jwks.json
      CLERK_ISSUER: https://bursting-asp-1.clerk.accounts.dev
      CLERK_JWT_ALGORITHM: RS256
      CONTROL_PLANE_ADMIN_TOKEN: local-admin-token
      DATA_PLANE_API_TOKEN: local-dev-token
      DATA_PLANE_TENANT_ID: org_38SbNxZ65gr09sqKWm378MUjsFV
      # Optional: per-tenant token map for rotation (JSON string).
      # Example:
      # DATA_PLANE_API_TOKENS: '{"org_123":["token-a","token-b"],"org_456":["token-x"]}'
      DATA_PLANE_API_TOKENS: ""
      DATA_PLANE_LOG_POLLS: "false"

    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "5678:5678"
    volumes:
      - ./control-plane:/app/control-plane   # 👈 only in dev compose
      - ./common:/app/common   # 👈 only in dev compose


  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      set -euo pipefail;
      echo "Waiting for Kafka...";
      for i in {1..60}; do
        kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1 && break;
        echo "waiting for kafka..." && sleep 1;
      done;
      kafka-topics --bootstrap-server kafka:9092
        --create --if-not-exists
        --topic job-events --partitions 3 --replication-factor 1;
      echo "Kafka topics created.";



  event-processor:
    build:
      context: .
      dockerfile: event-processor/Dockerfile
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/controlplane
      REDIS_URL: redis://redis:6379/0
      # The debugger will wait for a debugger to attach at port 5679
      # but this doesn't work with Clerk auth flows, so disabled for now.
      # Don't try to connect to the debugger through VSCode,
      # just run the UI with npm start
      WAIT_FOR_DEBUGGER: "0"
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5679:5679"
    volumes:
      - ./event-processor:/app/event-processor   # 👈 only in dev compose
      - ./common:/app/common   # 👈 only in dev compose

volumes:
  kafka-data: {}
  pg-data: {}
  redis-data: {}
